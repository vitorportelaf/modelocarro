spring.application.name=modelocarro
server.port=8080

springdoc.swagger-ui.path=/
api.version=v1

# Database (ambiente de producao - todas as variaveis sao obrigatorias)
spring.datasource.url=jdbc:mysql://${DB_SERVER_URL}:${DB_SERVER_PORT}/${DB_SCHEMA}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}

# JPA / Hibernate
# Em producao o schema e criado pelo script de migration, nao pelo Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
