spring.application.name=modelocarro
server.port=8080

springdoc.swagger-ui.path=/
api.version=v1

# Database
# Rodando a aplicacao na maquina local, use localhost como DB_SERVER_URL.
# Quando a API esta em um container e o MySQL esta no host,
# use host.docker.internal como DB_SERVER_URL.
spring.datasource.url=jdbc:mysql://${DB_SERVER_URL:localhost}:${DB_SERVER_PORT:3306}/${DB_SCHEMA:modelocarro}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PWD:root_pwd}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
