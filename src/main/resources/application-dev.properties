spring.application.name=modelocarro
server.port=8080

springdoc.swagger-ui.path=/
api.version=v1

# Database (ambiente de desenvolvimento)
spring.datasource.url=jdbc:mysql://${DB_SERVER_URL:localhost}:${DB_SERVER_PORT:3306}/${DB_SCHEMA:modelocarro_dev}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PWD:root_pwd}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
